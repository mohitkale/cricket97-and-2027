name: Task
description: A unit of work one agent or person can finish in one pull request
labels: ["status:triage"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One or two sentences. What is true for the player or the codebase when this is done?
    validations:
      required: true
  - type: textarea
    id: deliver
    attributes:
      label: Deliver
      description: Concrete things to build. Name folders and files where known.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Measurable checks. Each must be provable by a test, a capture or a measurement.
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
  - type: input
    id: deps
    attributes:
      label: Depends on
      description: Issue numbers that must be closed first
