<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pace practice · Cricket 2027</title>
    <script type="module" crossorigin src="/cricket97-and-2027/assets/play-CDXKvWXl.js"></script>
    <link rel="modulepreload" crossorigin href="/cricket97-and-2027/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/cricket97-and-2027/assets/three.core-CorS6puO.js">
    <link rel="modulepreload" crossorigin href="/cricket97-and-2027/assets/three.module-x478H1a7.js">
    <link rel="modulepreload" crossorigin href="/cricket97-and-2027/assets/player-bodies-w88zUHxl.js">
    <link rel="modulepreload" crossorigin href="/cricket97-and-2027/assets/live-fielders-Be0sPriS.js">
    <link rel="stylesheet" crossorigin href="/cricket97-and-2027/assets/play-CHt-TaYm.css">
  </head>
  <body>
    <main id="practice">
      <canvas id="pitch" aria-label="Cricket pitch. Swipe to drive or tap to defend." tabindex="0"></canvas>
      <header id="practice-hud">
        <div><p>Pace practice</p><strong id="score">0 / 0</strong> <span id="overs">0.0 / 5 overs</span><span id="on-strike"></span></div>
        <div id="practice-settings"><label>Assist <select id="assist"><option value="casual" selected>Casual</option><option value="classic">Classic</option><option value="pro">Pro</option></select></label> <label><input type="checkbox" id="trail" checked /> Trail</label> <label>Return <select id="return-end"><option value="">Auto</option><option value="striker">Striker's end</option><option value="bowler">Bowler's end</option></select></label><label><input type="checkbox" id="auto-next" checked /> Auto next</label></div>
      </header>
      <p id="cue" aria-live="polite"></p>
      <section id="practice-controls">
        <div id="bowling" hidden><label>Delivery <select id="delivery-type"><option value="stock">Stock pace</option><option value="swing-in">Inswing</option><option value="swing-away">Outswing</option><option value="slower">Slower ball</option><option value="off-spin">Off spin</option><option value="leg-spin">Leg spin</option></select></label><output aria-label="Release timing" hidden><span></span></output></div>
        <div id="feedback" hidden><strong></strong><meter aria-label="Shot timing" min="-1" max="1" value="0"></meter></div>
        <p id="help">← ↑ → drive · ↓ defend · Space loft</p>
        <button id="next" disabled>Loading pitch…</button>
        <button id="play-shot" hidden>Play shot</button>
        <button id="run-action" aria-keyshortcuts="R" hidden>Run</button><span id="run-risk" hidden></span>
        <a id="swap-practice" href="?role=bowl">Practise bowling</a>
        <a href="../legacy/?era=2027">Match setup</a>
      </section>
    </main>
  <div style="position:fixed;z-index:99999;left:0;bottom:0;padding:4px 10px;font:600 11px system-ui,sans-serif;background:#e5c45e;color:#101916;border-top-right-radius:8px;pointer-events:none;opacity:.92">Work in progress</div></body>
</html>
