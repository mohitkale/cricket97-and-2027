    <main id="practice">

        <div><p>Pace practice</p><strong id="score">0 / 0</strong> <span id="overs">0.0 / 5 overs</span></div>

      <section id="practice-controls">
        <div id="feedback" hidden><strong></strong><meter aria-label="Shot timing" min="-1" max="1" value="0"></meter></div>
        <p id="help">← ↑ → drive · ↓ defend · Space loft</p>
        <button id="next" disabled>Loading pitch…</button>
        <button id="play-shot" hidden>Play shot</button>
        <a href="../legacy/?era=2027">Match setup</a>
